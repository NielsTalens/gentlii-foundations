name: Feature Validation

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

jobs:
  validate:
    if: github.event.label.name == 'feature-validation'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install -e . --no-build-isolation

      - name: Write feature request markdown from issue
        env:
          issue_title: ${{ github.event.issue.title }}
          issue_body: ${{ github.event.issue.body }}
          issue_url: ${{ github.event.issue.html_url }}
        run: |
          if [ -z "${issue_body}" ]; then
            echo "Issue body is required for feature validation."
            exit 1
          fi
          cat <<EOF > feature-request.md
          # Feature Request

          ## Title
          ${issue_title}

          ## Description
          ${issue_body}

          ## Source
          ${issue_url}
          EOF

      - name: Run feature validator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: gentlii-foundations feature-validate product-definitions feature-request.md

      - name: Label issue with alignment score
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          report_path="product-definitions/product-description/feature-validator.md"
          alignment_score="$(
            awk '
              found && NF { print; exit }
              /^### Alignment score$/ { found = 1 }
            ' "$report_path"
          )"

          case "$alignment_score" in
            1/5) label_color="b60205" ;;
            2/5) label_color="d93f0b" ;;
            3/5) label_color="fbca04" ;;
            4/5) label_color="0e8a16" ;;
            5/5) label_color="0e8a16" ;;
            *)
              echo "::error::Could not extract a valid alignment score from $report_path"
              exit 1
              ;;
          esac

          target_label="alignment: $alignment_score"
          for score_label in "alignment: 1/5" "alignment: 2/5" "alignment: 3/5" "alignment: 4/5" "alignment: 5/5"; do
            if [ "$score_label" != "$target_label" ]; then
              gh issue edit "$ISSUE_NUMBER" --remove-label "$score_label" || true
            fi
          done

          gh label create "$target_label" \
            --color "$label_color" \
            --description "Feature validation alignment score $alignment_score" \
            --force
          gh issue edit "$ISSUE_NUMBER" --add-label "$target_label"

      - name: Comment feature validation result on issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file product-definitions/product-description/feature-validator.md

      - name: Stage pages source
        run: |
          mkdir -p pages-source
          cp product-definitions/product-description/*.html pages-source/
          cp product-definitions/product-description/styles.css pages-source/styles.css

      - name: Upload staged pages source
        uses: actions/upload-artifact@v4
        with:
          name: feature-validation-pages-source
          path: pages-source

  publish:
    needs: validate
    uses: ./.github/workflows/publish-pages.yml
    with:
      artifact_name: feature-validation-pages-source
    secrets: inherit
