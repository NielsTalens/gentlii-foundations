name: Product Guard

on:
  push:
    branches:
      - main
    paths:
      - product-definitions/product-description/strategy.md
      - product-definitions/product-description/business-case.md
      - product-definitions/product-description/product-vision.md
      - product-definitions/product-description/product-charter.md
      - product-definitions/product-description/index.html
      - product-definitions/product-description/styles.css

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install -e . --no-build-isolation

      - name: Run product guard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: gentlii-foundations guard product-definitions

      - name: Stage pages source
        run: |
          mkdir -p pages-source
          cp product-definitions/product-description/*.html pages-source/
          cp product-definitions/product-description/styles.css pages-source/styles.css

      - name: Upload staged pages source
        uses: actions/upload-artifact@v4
        with:
          name: product-guard-pages-source
          path: pages-source

      - name: Commit refreshed product guard when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-definitions/product-description/product-guard.md
          git add product-definitions/product-description/product-guard.html
          if git diff --cached --quiet; then
            echo "No product guard changes detected."
            exit 0
          fi
          git commit -m "chore: refresh product guard"
          git push

  publish:
    needs: guard
    uses: ./.github/workflows/publish-pages.yml
    with:
      artifact_name: product-guard-pages-source
    secrets: inherit
