name: Product Guard

on:
  push:
    branches:
      - main
    paths:
      - product-definitions/product-description/strategy.md
      - product-definitions/product-description/business-case.md
      - product-definitions/product-description/product-vision.md
      - product-definitions/product-description/product-charter.md
      - product-definitions/product-description/index.html
      - product-definitions/product-description/styles.css

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install -e . --no-build-isolation

      - name: Run product guard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: gentlii-foundations guard product-definitions

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p _site
          cp product-definitions/product-description/index.html _site/index.html
          cp product-definitions/product-description/product-guard.html _site/product-guard.html
          cp product-definitions/product-description/styles.css _site/styles.css
          cp logo.png _site/logo.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit refreshed product guard when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-definitions/product-description/product-guard.md
          git add product-definitions/product-description/product-guard.html
          if git diff --cached --quiet; then
            echo "No product guard changes detected."
            exit 0
          fi
          git commit -m "chore: refresh product guard"
          git push
